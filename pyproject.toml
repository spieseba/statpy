[build-system]
requires = ["uv_build>=0.12.17"]
build-backend = "uv_build"

[project]
name="statpy"
version = "2.0.0"
description = "Statistical analysis, error propagation and autocorrelation estimation of Markov chain Monte Carlo data."
readme="README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python=">=3.14"
authors = [
    {name="Sebastian Spiegel", email="spieseba@mailbox.org"}
]
dependencies=[
    "numpy",
    "scipy>=1.15",
    "iminuit",
    "numba",
    "h5py",
    "jax>=0.12.0",
    "matplotlib>=3.11",
]

[project.urls]
Repository = "https://github.com/spieseba/statpy"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.0.3",
    "ruff>=0.16",
    "scipy-stubs>=1.18.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyrefly]
preset = "default"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
