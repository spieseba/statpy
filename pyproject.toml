[build-system]
build-backend = "mesonpy"
requires = [
	"meson-python>=0.15",
	"meson>=1.2",
	"ninja"
]

[project]
name="statpy"
dynamic = ["version"] 
description = "Database system with statistics library for Lattice QCD simulations"
readme="README.md"
requires-python=">=3.12"
authors = [
    {name="Sebastian Spiegel", email="sebastian.spiegel@physik.uni-regensburg.de"}
]
dependencies=["numpy<2.4", "scipy", "iminuit", "dill", "frozendict", "numba", "h5py"]
